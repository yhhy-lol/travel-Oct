function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}
function dayNum(d){return d.match(/Day\s*(\d+)/)?.[1]||''}
function datePart(d){return d.match(/10\/\d+/)?.[0]||''}
function primaryCity(rows){let order=['阿姆斯特丹','布魯塞爾','鹿特丹','愛因荷芬','根特','布魯日','烈日市','盧森堡','海牙','烏特勒支']; for(const c of order) if(rows.some(r=>r['地區']===c)) return c; return rows.find(r=>r['地區'])?.['地區']||'阿姆斯特丹'}
function classify(r){const t=r['類型']||''; if(t.includes('住')) return 'hotel'; if(t.includes('交通')) return 'transport'; const a=r.Activity||''; if(/餐|吃|午餐|晚餐|早餐|甜|food|restaurant/i.test(a)) return 'food'; return 'place'}
function tags(r){let s=(r.Activity||'')+' '+(r.Notes||''); const out=[]; if(/已買票|已買|KLOOK|預約|訂位/.test(s)) out.push(['已預約','reserve']); if(/必吃|waffle|巧克力|啤酒|薯條|鯡魚|stroopwafel/i.test(s)) out.push(['必吃','food']); if(/伴手禮|必買/.test(s)) out.push(['必買','buy']); if(/視時間|視情況/.test(s)) out.push(['彈性','warn']); return out}
function navUrl(r){const q=encodeURIComponent((r.Location||r.Activity||'').replace(/🏞️|🚏/g,'')); return `https://www.google.com/maps/search/?api=1&query=${q}`}
function card(r){const cls=classify(r), ts=tags(r), note=(r.Notes||'').trim(); let guide=GUIDES[r.Activity]; let html=`<article class="card ${cls}"><div class="meta"><span class="time">${esc(r.Time||'時間未定')}</span><span class="badge">${cls==='transport'?'交通':cls==='hotel'?'住宿':cls==='food'?'餐廳／美食':'景點'}</span>${ts.map(x=>`<span class="badge ${x[1]}" >${x[0]}</span>`).join('')}</div><div class="title">${esc((r.Activity||'').replace(/🏞️|🚏/g,''))}</div><div class="loc">${esc(r.Location||'')}</div>`;
 if(ts.length) html+=`<div class="chips">${ts.map(x=>`<span class="chip ${x[1]}">${x[0]}</span>`).join('')}</div>`;

  const parts=tz=>{const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'longOffset'}).formatToParts(now); return p.find(x=>x.type==='timeZoneName')?.value||''};
  const offsetMinutes=tz=>{const z=parts(tz).replace('GMT',''); if(!z)return 0; const m=z.match(/([+-])(\d{2})(?::(\d{2}))?/); if(!m)return 0; return (m[1]==='-'?-1:1)*(+m[2]*60+(+(m[3]||0)));};
  const diff=offsetMinutes('Asia/Taipei')-offsetMinutes('Europe/Amsterdam');
  document.getElementById('clockDiff').textContent=`台灣快 ${Math.abs(diff)/60} 小時`;
}
function backToTop(){window.scrollTo({top:0,behavior:'smooth'})}
updateClocks(); setInterval(updateClocks,1000);
function updateTopButton(){const b=document.getElementById('topBtn');if(b)b.classList.toggle('show',window.scrollY>280)}
window.addEventListener('scroll',updateTopButton,{passive:true});
async function initWeather(){for(const el of document.querySelectorAll('.weather')){const city=el.dataset.city, c=CITY[city]; if(!c){el.querySelector('.sub').textContent='此日有多城市移動，請點選城市導航查看當地即時天氣。';continue} try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=16`; const data=await fetch(url).then(r=>r.json()); const date=el.dataset.date; const idx=data.daily?.time?.indexOf(date); const wc=idx>=0?data.daily.weather_code[idx]:data.current.weather_code; const max=idx>=0?Math.round(data.daily.temperature_2m_max[idx]):Math.round(data.current.temperature_2m); const min=idx>=0?Math.round(data.daily.temperature_2m_min[idx]):''; el.querySelector('.temp').textContent=idx>=0?`${min}° / ${max}°`:`${Math.round(data.current.temperature_2m)}°`; el.querySelector('.sub').textContent=idx>=0?`${weatherText(wc)} · 目前 ${Math.round(data.current.temperature_2m)}° · 風 ${Math.round(data.current.wind_speed_10m)} km/h`:`目前天氣：${weatherText(wc)} · 旅行日預報尚未開放` ; el.querySelector('.weathericon').textContent=weatherIcon(wc)}catch(e){el.querySelector('.sub').textContent='無法取得天氣；請確認網路後重新整理。'}}}
function weatherText(c){if(c===0)return'晴朗';if([1,2,3].includes(c))return'晴到多雲';if([45,48].includes(c))return'霧';if([51,53,55,56,57].includes(c))return'細雨';if([61,63,65,66,67].includes(c))return'雨';if([71,73,75,77].includes(c))return'降雪';if([80,81,82].includes(c))return'陣雨';if([95,96,99].includes(c))return'雷雨';return'天氣變化'}function weatherIcon(c){if(c===0)return'☀︎';if([1,2,3].includes(c))return'☼';if([45,48].includes(c))return'≋';if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(c))return'☂';if([95,96,99].includes(c))return'ϟ';return'☁︎'}
function observeDays(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('.daynav button').forEach(b=>b.classList.toggle('active',b.textContent==='D'+e.target.id.slice(1)))}}),{threshold:.55});document.querySelectorAll('.page').forEach(x=>io.observe(x))}
function showTrip(){document.getElementById('pages').style.display='block';document.getElementById('tools').style.display='none';document.getElementById('tripBtn').classList.add('active');const active=document.querySelector('.daynav button.active');showDay(active?active.textContent.replace('D',''):'1')}
function showTools(tab){document.getElementById('pages').style.display='none';const t=document.getElementById('tools');t.style.display='block';document.getElementById('tripBtn').classList.remove('active');t.innerHTML=tab==='budget'?budgetHTML():infoHTML(); if(tab==='budget')loadBudget()}
function infoHTML(){return `<div class="hero"><div class="eyebrow">TRAVEL TOOLBOX</div><div class="tooltitle">旅遊資訊</div><div class="toolsub">把最需要的資訊集中在一頁。</div></div><div class="panel"><h3>✈︎ 航班資訊</h3><div class="info"><b>去程</b><span>${flightInfo.out}</span><b>回程</b><span>${flightInfo.back}</span></div></div><div class="panel"><h3>⌂ 住宿資訊</h3>${hotels.map(x=>`<div class="call"><span>${esc(x)}</span></div>`).join('')}</div><div class="panel"><h3>☎ 緊急聯絡</h3>${emergency.map(x=>`<div class="call"><div><b>${esc(x[0])}</b><div class="sub">${esc(x[2])}</div></div><a href="tel:${x[1].replace(/[^+\d]/g,'')}">${esc(x[1])}</a></div>`).join('')}<div class="source">112 為歐盟緊急電話；駐外代表處電話依官方網站資料整理。</div></div><div class="panel"><h3>🎟 預約代號</h3><div class="empty">原始 PDF 有「已買票／KLOOK／預約」標記，但未提供可辨識的票券代號；請將 QR Code／訂單編號自行貼入這裡。</div><textarea id="codes" style="width:100%;min-height:90px;margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:9px" placeholder="例如：梵谷博物館 KLOOK：……"></textarea><button onclick="localStorage.setItem('codes',document.getElementById('codes').value)" style="margin-top:7px;border:0;border-radius:10px;padding:8px 12px">儲存</button></div>`}
function budgetHTML(){return `<div class="hero"><div class="eyebrow">BUDGET</div><div class="tooltitle">記帳／預算</div><div class="toolsub">資料只存在這台手機的瀏覽器 localStorage。</div></div><div class="panel"><div id="budgetRows"></div><button onclick="addBudget()" style="border:0;background:#eee8df;border-radius:10px;padding:8px 12px">＋ 新增一筆</button><div class="total"><span>總支出</span><span>€ <span id="budgetTotal">0.00</span></span></div></div>`}
function loadBudget(){const box=document.getElementById('budgetRows'), arr=JSON.parse(localStorage.getItem('budget')||'[]'); box.innerHTML=''; arr.forEach((x,i)=>addBudget(x,i)); document.getElementById('budgetTotal').textContent=arr.reduce((s,x)=>s+(+x.amount||0),0).toFixed(2)}
function addBudget(item={name:'',amount:''},idx=null){const box=document.getElementById('budgetRows'),i=idx??box.children.length; const row=document.createElement('div');row.className='budgetrow';row.innerHTML=`<input placeholder="項目" value="${esc(item.name)}"><input type="number" step="0.01" placeholder="€" value="${esc(item.amount)}"><button>×</button>`;row.querySelector('button').onclick=()=>{row.remove();saveBudget()};row.querySelectorAll('input').forEach(x=>x.oninput=saveBudget);box.appendChild(row);saveBudget()}
function saveBudget(){const arr=[...document.querySelectorAll('.budgetrow')].map(r=>({name:r.children[0].value,amount:r.children[1].value}));localStorage.setItem('budget',JSON.stringify(arr));const total=arr.reduce((s,x)=>s+(+x.amount||0),0);const el=document.getElementById('budgetTotal');if(el)el.textContent=total.toFixed(2)}
render();updateTopButton();if(localStorage.getItem('codes')){};
</script></body></html>
